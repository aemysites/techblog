# Query index for the post-list block and the sidebar "Recent Posts".
# Applied through the configuration service (helix-query.yaml is retired):
#   POST https://admin.hlx.page/config/aemysites/sites/techblog/content/query.yaml
# Only published pages are indexed. Rows without a date (homepage, listings,
# static pages) are ignored by scripts/post-index.js.
version: 1

indices:
  posts:
    include:
      - '/**'
    exclude:
      - '/nav'
      - '/footer'
      - '/fragments/**'
      - '/drafts/**'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, "content"), "https:\/\/[^/]+(\/.*)")
      author:
        select: head > meta[name="author"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="publication-date"]
        value: attribute(el, "content")
      categories:
        select: head > meta[name="categories"]
        value: attribute(el, "content")
      tags:
        select: head > meta[property="article:tag"]
        values: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
